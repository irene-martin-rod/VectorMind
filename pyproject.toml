[project]
name = "vectormind"
version = "0.1.0"
description = "An open-source scientific information retrieval engine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "numpy",
    "pandas",
    "sentence-transformers",
    "rank-bm25",
    "beir",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"